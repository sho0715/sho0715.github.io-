<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f4">
<title>赤シート暗記</title>
<style>
:root{--red:#c83b3b;--ink:#252525;--muted:#737373;--line:#e6e2dc}
*{box-sizing:border-box}
body{margin:0;background:#f8f7f4;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
header{padding:16px 16px 13px;background:#fff;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0;font-weight:750}.subtitle{font-size:12px;color:var(--muted);margin-top:5px}
main{max-width:850px;margin:auto;padding:12px;display:grid;gap:12px}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:14px}
h2{font-size:15px;margin:0 0 10px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,.filelabel,select{font:inherit;font-size:14px;font-weight:650;border:1px solid #e4e0da;border-radius:11px;background:#f5f3ef;padding:10px 12px;color:var(--ink)}
button.primary{background:var(--red);border-color:var(--red);color:white}
button:disabled{opacity:.45}
input[type=file]{display:none}
#pages{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.pagebtn{white-space:nowrap;flex:0 0 auto}
.pagebtn.active{background:#292929;color:white;border-color:#292929}
#status{font-size:13px;color:#5d5d5d;line-height:1.5;margin-top:9px}
#canvasWrap{background:#e9e6e0;border-radius:10px;overflow:auto;max-height:72vh;display:flex;justify-content:center;align-items:flex-start}
canvas{display:block;width:100%;height:auto;touch-action:manipulation}
.hint{font-size:12px;color:var(--muted);line-height:1.55;margin:9px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
progress{width:100%;height:6px;margin-top:9px;accent-color:var(--red)}
.small{font-size:11px;color:#85817b}
@media(min-width:700px){main{grid-template-columns:270px 1fr;align-items:start}.study{grid-column:2;grid-row:1 / span 3}}
</style>
</head>
<body>
<header><h1>🔴 赤シート暗記</h1><div class="subtitle">写真の赤文字を隠して、タップで答えを確認</div></header>
<main>
<section class="card">
<h2>① 写真を読み込む</h2>
<label class="filelabel" for="picker">写真を6枚まで選ぶ</label>
<input id="picker" type="file" accept="image/*" multiple>
<div class="small" style="margin-top:8px">写真はこの端末のブラウザ内だけで処理します。サーバーには送信しません。</div>
<div id="pages"></div>
<div id="status" aria-live="polite">写真を選ぶと暗記を始められます。</div>
<progress id="progress" value="0" max="100" hidden></progress>
</section>
<section class="card">
<h2>② 暗記する</h2>
<div class="actions">
<button id="hideAll" class="primary" disabled>全部隠す</button>
<button id="showAll" disabled>全部表示</button>
<button id="reset" disabled>最初から</button>
</div>
<p class="hint">赤文字の近くをタップすると、その周辺の答えが表示されます。もう一度タップすると隠れます。</p>
</section>
<section class="card study">
<div id="canvasWrap"><canvas id="c"></canvas></div>
<p class="hint">※ 赤色の判定は自動です。赤い図・線も対象になることがあります。文字が細かい場合は写真を拡大して撮ると認識しやすくなります。</p>
</section>
</main>
<script>
const $=id=>document.getElementById(id), canvas=$('c'),ctx=canvas.getContext('2d',{willReadFrequently:true});
let items=[],active=-1,shown=new Set(),tiles=[],tileSize=30,ready=false;
const status=t=>$('status').textContent=t;
function redAt(r,g,b){return r>72 && r-g>20 && r-b>12 && r>g*1.10 && r>b*1.07;}
function processImage(img){
  const maxW=1250,maxH=1800,scale=Math.min(1,maxW/img.naturalWidth,maxH/img.naturalHeight);
  const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
  const src=document.createElement('canvas');src.width=w;src.height=h;
  const sctx=src.getContext('2d',{willReadFrequently:true});sctx.drawImage(img,0,0,w,h);
  const original=sctx.getImageData(0,0,w,h), data=original.data, mask=new Uint8Array(w*h);
  // Identify red pixels. This is deliberately lightweight and runs locally.
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const p=(y*w+x)*4;if(redAt(data[p],data[p+1],data[p+2]))mask[y*w+x]=1;
  }
  // Make a natural-looking local fill by averaging nearby non-red pixels.
  const hidden=new ImageData(new Uint8ClampedArray(data),w,h), hd=hidden.data;
  const radius=5;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x;if(!mask[i])continue;
    let rr=0,gg=0,bb=0,n=0;
    for(let dy=-radius;dy<=radius;dy+=2)for(let dx=-radius;dx<=radius;dx+=2){
      const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=w||yy>=h)continue;
      const j=yy*w+xx;if(mask[j])continue;
      const p=j*4;rr+=data[p];gg+=data[p+1];bb+=data[p+2];n++;
    }
    if(n){const p=i*4;hd[p]=rr/n;hd[p+1]=gg/n;hd[p+2]=bb/n;}
  }
  // Group nearby red marks into tappable tiles.
  const cols=Math.ceil(w/tileSize),rows=Math.ceil(h/tileSize),has=new Uint8Array(cols*rows);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(mask[y*w+x])has[Math.floor(y/tileSize)*cols+Math.floor(x/tileSize)]=1;
  const regions=[];
  for(let ty=0;ty<rows;ty++)for(let tx=0;tx<cols;tx++)if(has[ty*cols+tx])regions.push({x:tx*tileSize,y:ty*tileSize,w:Math.min(tileSize,w-tx*tileSize),h:Math.min(tileSize,h-ty*tileSize)});
  const hiddenCanvas=document.createElement('canvas');hiddenCanvas.width=w;hiddenCanvas.height=h;
  hiddenCanvas.getContext('2d').putImageData(hidden,0,0);
  return {w,h,originalCanvas:src,hiddenCanvas,regions,name:''};
}
function render(){
 if(active<0||!items[active])return;
 const it=items[active];canvas.width=it.w;canvas.height=it.h;
 ctx.clearRect(0,0,it.w,it.h);ctx.drawImage(it.hiddenCanvas,0,0);
 for(const i of shown){const r=it.regions[i];ctx.drawImage(it.originalCanvas,r.x,r.y,r.w,r.h,r.x,r.y,r.w,r.h);}
}
function choose(i){active=i;shown.clear();ready=true;render();drawButtons();status(`${items[i].name}｜赤文字のある範囲 ${items[i].regions.length}か所。タップして答えを表示。`);document.querySelectorAll('.pagebtn').forEach((b,j)=>b.classList.toggle('active',j===i));}
function drawButtons(){const enabled=active>=0;$('hideAll').disabled=!enabled;$('showAll').disabled=!enabled;$('reset').disabled=!enabled;}
function updatePages(){
 const root=$('pages');root.innerHTML='';
 items.forEach((it,i)=>{const b=document.createElement('button');b.className='pagebtn'+(i===active?' active':'');b.textContent=`写真${i+1}`;b.onclick=()=>choose(i);root.appendChild(b);});
}
$('picker').addEventListener('change',async e=>{
 const files=Array.from(e.target.files||[]).filter(f=>f.type.startsWith('image/')).slice(0,6);
 if(!files.length)return;
 items=[];active=-1;shown.clear();ready=false;updatePages();drawButtons();
 $('progress').hidden=false;$('progress').value=0;
 for(let i=0;i<files.length;i++){
  status(`写真を処理中… ${i+1}/${files.length}`);
  try{
   const url=URL.createObjectURL(files[i]);
   const img=new Image();
   await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url;});
   const item=processImage(img);item.name=files[i].name||`写真${i+1}`;items.push(item);URL.revokeObjectURL(url);
   $('progress').value=(i+1)/files.length*100;
  }catch(err){console.error(err);}
 }
 $('progress').hidden=true;updatePages();
 if(items.length){choose(0);}else status('写真を読み込めませんでした。別の写真を選んでください。');
 e.target.value='';
});
canvas.addEventListener('click',e=>{
 if(!ready||active<0)return;
 const it=items[active],r=canvas.getBoundingClientRect();
 const x=(e.clientX-r.left)*it.w/r.width,y=(e.clientY-r.top)*it.h/r.height;
 let best=-1,dist=Infinity;
 it.regions.forEach((q,i)=>{
  const px=Math.max(q.x,Math.min(x,q.x+q.w)),py=Math.max(q.y,Math.min(y,q.y+q.h));
  const d=Math.hypot(x-px,y-py);if(d<dist){dist=d;best=i;}
 });
 if(best>=0&&dist<Math.max(18,it.w*.02)){
  if(shown.has(best))shown.delete(best);else shown.add(best);
  render();status(`写真${active+1}｜表示中 ${shown.size}/${it.regions.length}か所`);
 }
});
$('hideAll').onclick=()=>{shown.clear();render();status('すべて隠しました。');};
$('showAll').onclick=()=>{shown=new Set(items[active].regions.map((_,i)=>i));render();status('答えをすべて表示しています。');};
$('reset').onclick=()=>choose(active);
</script>
</body></html>
